name: Regenerate benchmark evidence

on:
  push:
    branches: [improve/topology-benchmark-evidence]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute notebook and regenerate evidence
        run: |
          python -m nbconvert --to notebook --execute main.ipynb --output executed_main.ipynb --ExecutePreprocessor.timeout=600
          python check_phase1_submission.py
      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-phase1-evidence
          path: |
            executed_main.ipynb
            README.md
            report.md
            results/tables/**
            results/figures/**
          if-no-files-found: error
          retention-days: 7
